name: Run static analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  static_analysis_dev:
    if: github.repository_owner == 'prusa3d' || github.repository_owner == 'Prusa-Development'
    uses: Prusa-Development/PrusaSlicer-Actions/.github/workflows/static_analysis.yml@master
    secrets: inherit
    with:
      branch: ms_dev
      actions_branch: master
