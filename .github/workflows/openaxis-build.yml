name: OpenAxis desktop builds

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved full commit SHA (must match the selected branch revision)
        type: string
        required: true
      platform:
        description: Platform to build (use a single platform when debugging)
        type: choice
        default: all
        options: [all, windows, macos, macos-arm64, macos-x86_64, linux]

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: openaxis-build-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  release-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify approved source commit
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || {
            echo 'Selected branch revision differs from the approved full SHA.' >&2; exit 1;
          }
      - name: Test release safeguards
        run: |
          python3 .github/scripts/test-promotion.py

  desktop:
    if: inputs.platform != 'linux'
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON('{"all":[{"platform":"windows-x64","runner":"windows-2022","script":"windows"},{"platform":"macos-arm64","runner":"macos-15","script":"macos"},{"platform":"macos-x86_64","runner":"macos-15-intel","script":"macos"}],"windows":[{"platform":"windows-x64","runner":"windows-2022","script":"windows"}],"macos":[{"platform":"macos-arm64","runner":"macos-15","script":"macos"},{"platform":"macos-x86_64","runner":"macos-15-intel","script":"macos"}],"linux":[],"macos-arm64":[{"platform":"macos-arm64","runner":"macos-15","script":"macos"}],"macos-x86_64":[{"platform":"macos-x86_64","runner":"macos-15-intel","script":"macos"}]}')[inputs.platform || 'all'] }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved source commit
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || {
            echo 'Selected branch revision differs from the approved full SHA.' >&2; exit 1;
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CMake
        run: python -m pip install cmake==3.31.6
      - name: Prepare logs
        run: mkdir -p ci-logs
      - name: Select build parallelism
        run: python .github/scripts/build-budget.py | tee ci-logs/build-budget.log
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install ccache
          bash .github/scripts/macos-build.sh prerequisites 2>&1 | tee ci-logs/prerequisites.log
      - name: Configure compiler cache
        if: runner.os != 'Windows'
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
      - name: Restore compiler cache
        if: runner.os != 'Windows'
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-296-v1-${{ matrix.runner }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-296-v1-${{ matrix.runner }}-${{ runner.arch }}-
      - name: Restore dependency build
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/build-ci
          key: deps-296-v1-${{ matrix.runner }}-${{ runner.arch }}-cmake3316-${{ hashFiles('deps/**', 'cmake/modules/AddCMakeProject.cmake', 'cmake/modules/OSXDeploymentTarget.cmake', '.github/scripts/*-build.*') }}-${{ env.RUNNER_IMAGE_VERSION }}
          restore-keys: |
            deps-296-v1-${{ matrix.runner }}-${{ runner.arch }}-cmake3316-
      - name: Build dependencies (Unix)
        if: runner.os != 'Windows' && steps.deps-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/${{ matrix.script }}-build.sh deps 2>&1 | tee ci-logs/deps.log
      - name: Build dependencies (Windows)
        if: runner.os == 'Windows' && steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .github/scripts/windows-build.ps1 deps *>&1 | Tee-Object "$env:GITHUB_WORKSPACE/ci-logs/deps.log"
      - name: Save dependency build
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/build-ci
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - name: Build and test (Unix)
        id: unix-build
        if: runner.os != 'Windows'
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: bash .github/scripts/${{ matrix.script }}-build.sh build 2>&1 | tee ci-logs/build.log
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/windows-build.ps1 build *>&1 | Tee-Object "$env:GITHUB_WORKSPACE/ci-logs/build.log"
      - name: Compiler cache statistics
        if: always() && runner.os != 'Windows' && (steps.unix-build.outcome == 'success' || steps.unix-build.outcome == 'failure')
        run: ccache --show-stats --verbose | tee ci-logs/ccache.log
      - name: Save compiler cache before packaging
        if: ${{ !cancelled() && runner.os != 'Windows' && (steps.unix-build.outcome == 'success' || steps.unix-build.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Package and smoke test (Unix)
        if: runner.os != 'Windows'
        run: bash .github/scripts/${{ matrix.script }}-build.sh package 2>&1 | tee ci-logs/package.log
      - name: Package and smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/windows-build.ps1 package *>&1 | Tee-Object "$env:GITHUB_WORKSPACE/ci-logs/package.log"
      - name: Upload package
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload package checksum
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: dist/*.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS app directly
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: dist/macos-app-*-${{ github.sha }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Attest distributable packages
        if: >-
          github.repository == 'rotatrix/PrusaSlicer' &&
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/heads/rotatrix/')
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ci-logs/
            build-ci/CMakeCache.txt
            build-ci/CMakeFiles/CMakeConfigureLog.yaml
            deps/build-ci/CMakeFiles/CMakeConfigureLog.yaml
            build-ci/openaxis-checks/Testing/Temporary/LastTest.log
            build-ci/openaxis-tests/Testing/Temporary/LastTest.log
          retention-days: 14


  linux:
    name: linux-x64
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved source commit
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-yaml
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-296-v1-${{ hashFiles('.github/scripts/flatpak-*') }}-${{ github.sha }}
          restore-keys: |
            flatpak-296-v1-${{ hashFiles('.github/scripts/flatpak-*') }}-
      - name: Build upstream Flatpak and smoke test
        run: |
          mkdir -p ci-logs
          bash .github/scripts/flatpak-build.sh 2>&1 | tee ci-logs/flatpak.log
      - name: Upload Linux bundle directly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: dist/*.flatpak
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: dist/*.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Attest Linux bundle
        if: github.repository == 'rotatrix/PrusaSlicer' && startsWith(github.ref, 'refs/heads/rotatrix/')
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*.flatpak
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux-x64-${{ github.sha }}
          path: |
            ci-logs/
            build-flatpak-recipe/com.prusa3d.PrusaSlicer.json
          retention-days: 14
